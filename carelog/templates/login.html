<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – CareMin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <p class="eyebrow">CareMin</p>
    <h1>Sign in</h1>
    <p class="muted">Care minutes compliance for Australian aged care.</p>

    {% if error %}<div class="errors"><ul><li>{{ error }}</li></ul></div>{% endif %}
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}

    <form method="post" class="form">
      <label>Email
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
