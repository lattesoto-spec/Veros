app = "veros"
primary_region = "syd"

[build]

# DATABASE_URL and the other secrets are set with `fly secrets set`.
# There is no volume: state lives in Postgres and object storage.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
